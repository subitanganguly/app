<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE INDIAFACE</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{overflow:hidden;font-family:Arial,Helvetica,sans-serif}

.video-bg{
position:fixed;inset:0;width:100%;height:100%;
object-fit:cover;z-index:-2;transition:.8s;
}
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:-1;
}
.brand-card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
padding:40px;
color:#fff;
max-width:850px;
text-align:center;
animation:fadeUp 1s ease;
max-height:85vh;
overflow:auto;
}
.logo{
width:90px;height:90px;border-radius:50%;
background:#fff;color:#000;
display:flex;align-items:center;justify-content:center;
margin:auto;font-size:40px;
}
.footer{
position:fixed;bottom:10px;width:100%;
text-align:center;color:#fff;font-size:13px;
}

.video-flip-out{animation:videoFlipOut .8s forwards}
.video-flip-in{animation:videoFlipIn .8s}
.card-bounce-out{animation:cardOut .7s forwards}
.card-bounce-in{animation:cardIn .9s}

@keyframes fadeUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}
@keyframes videoFlipOut{
to{transform:rotateY(90deg);opacity:0}
}
@keyframes videoFlipIn{
from{transform:rotateY(-90deg);opacity:0}
to{transform:rotateY(0);opacity:1}
}
@keyframes cardOut{
to{opacity:0;transform:translateY(-80px) scale(.8)}
}
@keyframes cardIn{
from{opacity:0;transform:translateY(80px) scale(.8)}
to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:768px){
.brand-card{padding:25px}
h1{font-size:1.8rem}
}
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline class="video-bg">
<source id="videoSource" src="video/timelapse.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container vh-100 d-flex align-items-center justify-content-center">
<div class="brand-card" id="heroCard">

<div class="logo">
<i class="bi bi-lightning-charge-fill"></i>
</div>

<h1 class="mt-3">
<span style="color:#ff7300">THE</span>
INDIA<span style="color:#22c55e">FACE</span>
</h1>

<p class="lead mt-4">Social Work • Agriculture • Commerce • Community</p>

<p>
Building a stronger India through online business, sustainable agriculture,
and meaningful social impact.
</p>

<div class="mt-4">
<a href="dashboard.html" class="btn btn-primary btn-lg me-2">Explore</a>

<button id="learnBtn" class="btn btn-outline-light btn-lg">
<i class="bi bi-info-circle"></i> Learn More
</button>
</div>

</div>
</div>

<div class="footer">
© 2026 THE INDIAFACE • Growing Together
</div>

<script>
const learnBtn=document.getElementById("learnBtn");
const hero=document.getElementById("heroCard");
const video=document.getElementById("bgVideo");
const source=document.getElementById("videoSource");

learnBtn.addEventListener("click",()=>{

video.classList.add("video-flip-out");
hero.classList.add("card-bounce-out");

setTimeout(()=>{

source.src="video/timelapse1.mp4";
video.load();
video.play();

video.classList.remove("video-flip-out");
video.classList.add("video-flip-in");

hero.innerHTML=`

<div class="logo">
<i class="bi bi-globe2"></i>
</div>

<h1 class="mt-3">ABOUT THE INDIAFACE</h1>

<p class="lead mt-3">
Empowering India Through Innovation, Agriculture & Community Service
</p>

<hr class="border-light">

<h4>🛒 Online Product Selling</h4>
<p>
We connect customers with quality products through modern digital commerce,
supporting local businesses and entrepreneurs across India.
</p>

<h4>🌾 Agriculture</h4>
<p>
We promote sustainable farming, farmer empowerment, agricultural innovation,
organic practices, and improved market access for rural communities.
</p>

<h4>🤝 Social Work & Community Service</h4>
<p>
We support education, healthcare, environmental conservation, rural development,
and community welfare initiatives that create lasting positive impact.
</p>

<h4>🎯 Mission</h4>
<p>
To deliver quality products and services, empower farmers and entrepreneurs,
promote sustainability, create opportunities, and contribute to society through
innovation and responsibility.
</p>

<h4>👁️ Vision</h4>
<p>
To become one of India's most trusted brands by integrating technology,
agriculture, e-commerce, and community development into a platform that creates
sustainable growth for future generations.
</p>

<h4>⭐ Core Values</h4>
<p>
Integrity • Innovation • Quality • Sustainability • Community • Customer First
</p>

<button class="btn btn-warning mt-3" onclick="location.reload()">
<i class="bi bi-arrow-left"></i> Back To Home
</button>
`;

hero.classList.remove("card-bounce-out");
hero.classList.add("card-bounce-in");

},800);
});
</script>

</body>
</html>
