<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archive · THE INDIA FACE</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Firebase 8 (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- login.js (config, auth, db) -->
    <script src="js/login.js"></script>
    <script src="js/sg.js"></script>
    <script src="js/include.js"></script>
    <style>
        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 50px;
        }
        .page-header {
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            padding: 1rem 0;
            margin-bottom: 1rem;
            border-radius: 0 0 40px 40px;
            color: white;
            box-shadow: 0 8px 30px rgba(13, 110, 253, 0.2);
        }
        .page-header h1 {
            font-weight: 800;
            font-size: 2.2rem;
        }
        .page-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        .archive-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            transition: 0.25s ease;
            border-left: 3px solid #6c757d;
            height: 100%;
            position: relative;
            opacity: 0.85;
        }
        .archive-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.07);
            opacity: 1;
        }
        .archive-card .badge-type {
            font-size: 0.65rem;
            padding: 0.3rem 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #e9edf4;
            color: #1e293b;
        }
        .archive-card .badge-date {
            background: #f1f5f9;
            color: #475569;
            font-weight: 500;
        }
        .archive-card .badge-archived {
            background: #6c757d;
            color: white;
            font-size: 0.6rem;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .archive-card .pdf-link {
            color: #dc3545;
            text-decoration: none;
            font-weight: 500;
            margin-left: auto;
            cursor: pointer;
        }
        .archive-card .pdf-link:hover {
            text-decoration: underline;
        }
        .archive-card .card-title {
            font-weight: 700;
            color: #0b1e33;
            margin-top: 0.5rem;
        }
        .archive-card .card-text {
            color: #475569;
            font-size: 0.95rem;
        }
        .empty-state {
            background: white;
            border-radius: 30px;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
        }
        .search-section {
            background: white;
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            border: 1px solid #e9edf4;
            max-width: 1400px;
            margin: 0 auto 1.5rem auto;
        }
        .search-section input {
            border: none;
            padding: 0.6rem 0;
            font-size: 0.95rem;
            outline: none;
            background: transparent;
            width: 100%;
        }
        .search-section button {
            border-radius: 40px;
            padding: 0.2rem 1.2rem;
            background: #6c757d;
            border: none;
            color: white;
            font-weight: 500;
            transition: 0.2s;
        }
        .search-section button:hover {
            background: #5a6268;
        }
        .pagination-wrap {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        .pagination-wrap .page-btn {
            background: white;
            border: 1px solid #dee2e6;
            color: #0b1e33;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-weight: 500;
            transition: 0.15s;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .pagination-wrap .page-btn.active {
            background: #6c757d;
            border-color: #6c757d;
            color: white;
        }
        .pagination-wrap .page-btn:hover:not(.active) {
            background: #f1f5f9;
        }
        .back-link {
            color: white;
            text-decoration: none;
            opacity: 0.9;
            transition: 0.2s;
        }
        .back-link:hover {
            color: white;
            opacity: 1;
            text-decoration: underline;
        }
        .archive-badge-header {
            background: rgba(255,255,255,0.2);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        /* Footer */ 
        footer{ background:#212529; color:#fff; } 
        footer a{ color:#adb5bd; text-decoration:none; } 
        footer a:hover{ color:#fff; } 
        @media (max-width: 576px) {
            .page-header h1 { font-size: 1.6rem; }
            .archive-card { padding: 1.2rem; }
            .search-section { border-radius: 40px; padding: 0.3rem 0.3rem 0.3rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <div id="navbar"></div>

    <!-- ================= PAGE HEADER ================= -->
    <div class="page-header">
        <div class="container">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <i class="bi bi-archive fs-1"></i>
                <div>
                    <h1 class="mb-0">
                        Archive 
                        <span class="archive-badge-header" id="archiveTypeBadge">All</span>
                    </h1>
                    <p class="mb-0">
                        <a href="javascript:history.back()" class="back-link">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </a>
                        <span class="ms-2" id="archiveDescription">View archived posts from THE INDIA FACE</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= ARCHIVE LIST ================= -->
    <div class="container flex-grow-1">
        <!-- Search bar -->
        <div class="search-section d-flex align-items-center">
            <i class="bi bi-search text-secondary me-2"></i>
            <input type="text" id="searchInput" class="form-control-plaintext" placeholder="Search archived posts..." aria-label="Search">
            <button id="searchBtn" class="btn btn-sm"><i class="bi bi-arrow-right"></i> Search</button>
        </div>

        <div id="archiveContainer">
            <!-- Loading state -->
            <div class="text-center py-5" id="loadingArchive">
                <div class="spinner-border text-secondary" role="status"></div>
                <p class="mt-2 text-secondary">Loading archived posts...</p>
            </div>
        </div>

        <!-- Pagination controls -->
        <div class="pagination-wrap" id="paginationControls"></div>
    </div>

    <!-- ================= FOOTER ================= -->
    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================
        // 1. AUTH / NAVBAR SCRIPT (same as index)
        // ============================================
        firebase.auth().onAuthStateChanged(function(user) {
            const signInBtn = document.getElementById("signInBtn");
            const signUpBtn = document.getElementById("signUpBtn");
            const userArea = document.getElementById("userArea");
            const adminBtn = document.getElementById("adminBtn");

            if (!user) {
                signInBtn.style.display = "inline-block";
                signUpBtn.style.display = "inline-block";
                userArea.style.display = "none";
                if (adminBtn) adminBtn.remove();
                return;
            }

            const name = localStorage.getItem("name") || "User";
            const type = localStorage.getItem("type");

            signInBtn.style.display = "none";
            signUpBtn.style.display = "none";
            userArea.style.display = "block";

            const initials = name.trim().split(" ").map(n => n.charAt(0).toUpperCase()).join("");
            document.getElementById("userName").textContent = initials;

            // Admin button
            if (type === "admin") {
                if (!adminBtn) {
                    const btn = document.createElement("a");
                    btn.id = "adminBtn";
                    btn.href = "ad-index.html";
                    btn.className = "btn btn-danger btn-sm me-2";
                    btn.innerHTML = '<i class="bi bi-shield-lock"></i> Admin';
                    document.getElementById("authArea").insertBefore(btn, userArea);
                }
            } else {
                if (adminBtn) adminBtn.remove();
            }
        });

        // ============================================
        // 2. PDF DOWNLOAD FUNCTION
        // ============================================
        function downloadPDF(pdfUrl, fileName) {
            let downloadUrl = pdfUrl;
            if (pdfUrl.includes('drive.google.com')) {
                let fileId = null;
                const fileIdMatch = pdfUrl.match(/\/file\/d\/([^\/]+)/);
                if (fileIdMatch) fileId = fileIdMatch[1];
                const openIdMatch = pdfUrl.match(/[?&]id=([^&]+)/);
                if (openIdMatch) fileId = openIdMatch[1];
                const ucIdMatch = pdfUrl.match(/[?&]id=([^&]+)/);
                if (ucIdMatch) fileId = ucIdMatch[1];
                if (fileId) {
                    downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
                }
            }
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = fileName || 'archived.pdf';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ============================================
        // 3. ARCHIVE LOGIC with SEARCH + PAGINATION
        // ============================================
        let allPosts = [];
        let filteredPosts = [];
        const perPage = 20;
        let currentPage = 1;
        let currentFilter = 'all'; // 'all', 'notice', 'announcement', 'event'

        // Get the referrer page to determine filter
        function getFilterFromReferrer() {
            const referrer = document.referrer;
            if (!referrer) return 'all';
            
            // Check which page the user came from
            if (referrer.includes('notice.html')) {
                return 'notice';
            } else if (referrer.includes('announcement.html')) {
                return 'announcement';
            } else if (referrer.includes('events.html')) {
                return 'event';
            }
            return 'all';
        }

        function updateHeader(filter) {
            const badge = document.getElementById('archiveTypeBadge');
            const desc = document.getElementById('archiveDescription');
            
            const typeMap = {
                'all': { label: 'All Types', desc: 'View all archived posts from THE INDIA FACE' },
                'notice': { label: 'Notices', desc: 'View archived notices from THE INDIA FACE' },
                'announcement': { label: 'Announcements', desc: 'View archived announcements from THE INDIA FACE' },
                'event': { label: 'Events', desc: 'View archived events from THE INDIA FACE' }
            };
            
            const info = typeMap[filter] || typeMap['all'];
            badge.textContent = info.label;
            desc.textContent = info.desc;
        }

        function renderArchive(page, searchTerm) {
            const container = document.getElementById('archiveContainer');
            const pagination = document.getElementById('paginationControls');

            let data = allPosts;
            
            // Apply search filter
            if (searchTerm && searchTerm.trim() !== '') {
                const term = searchTerm.trim().toLowerCase();
                data = data.filter(p => 
                    (p.title && p.title.toLowerCase().includes(term)) ||
                    (p.description && p.description.toLowerCase().includes(term)) ||
                    (p.type && p.type.toLowerCase().includes(term))
                );
            }
            
            // Apply type filter
            if (currentFilter !== 'all') {
                data = data.filter(p => p.type === currentFilter);
            }
            
            filteredPosts = data;

            const total = filteredPosts.length;
            const totalPages = Math.ceil(total / perPage) || 1;
            if (page > totalPages) page = totalPages;
            if (page < 1) page = 1;
            currentPage = page;

            const start = (page - 1) * perPage;
            const end = Math.min(start + perPage, total);
            const pageItems = filteredPosts.slice(start, end);

            if (total === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-archive"></i>
                        <h4 class="mt-3 fw-bold">No Archived Posts</h4>
                        <p class="text-secondary">There are no archived posts matching your criteria.</p>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary mt-2">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </a>
                    </div>
                `;
                pagination.innerHTML = '';
                return;
            }

            let html = `<div class="row g-2">`;
            pageItems.forEach(p => {
                const typeLabel = p.type || 'unknown';
                const dateStr = p.date || 'No date';
                const title = p.title || 'Untitled';
                const desc = p.description || '';
                const pdfUrl = p.pdfUrl || null;
                const archivedAt = p.archivedAt ? new Date(p.archivedAt).toLocaleDateString() : 'Unknown';

                let pdfHtml = '';
                if (pdfUrl) {
                    const fileName = (p.title || 'archived').replace(/\s+/g, '_') + '.pdf';
                    pdfHtml = `<a href="#" class="pdf-link" onclick="downloadPDF('${pdfUrl}', '${fileName}'); return false;"><i class="bi bi-file-pdf me-1"></i>PDF</a>`;
                }

                // Color coding for different types
                let typeColor = 'secondary';
                if (typeLabel === 'notice') typeColor = 'primary';
                else if (typeLabel === 'announcement') typeColor = 'info';
                else if (typeLabel === 'event') typeColor = 'success';

                html += `
                    <div class="col-md-12 col-lg-12">
                        <div class="archive-card d-flex flex-column">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="badge badge-type bg-${typeColor} text-white">${typeLabel}</span>
                                <span class="badge badge-date"><i class="bi bi-calendar3 me-1"></i>${dateStr}</span>
                                <span class="badge badge-archived"><i class="bi bi-clock-history me-1"></i>Archived</span>
                                ${pdfHtml}
                            </div>
                            <h5 class="card-title">${title}</h5>
                            ${desc ? `<p class="card-text">${desc}</p>` : ''}
                            <small class="text-muted mt-1"><i class="bi bi-info-circle"></i> Archived on: ${archivedAt}</small>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            // Pagination
            let pagHtml = '';
            if (totalPages > 1) {
                for (let i = 1; i <= totalPages; i++) {
                    pagHtml += `<button class="page-btn ${i === page ? 'active' : ''}" data-page="${i}">${i}</button>`;
                }
            }
            pagination.innerHTML = pagHtml;
            pagination.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const pg = parseInt(this.dataset.page);
                    const searchVal = document.getElementById('searchInput').value;
                    renderArchive(pg, searchVal);
                    window.scrollTo({ top: document.getElementById('archiveContainer').offsetTop - 20, behavior: 'smooth' });
                });
            });
        }

        function loadArchive(searchTerm) {
            const container = document.getElementById('archiveContainer');
            container.innerHTML = `
                <div class="text-center py-5" id="loadingArchive">
                    <div class="spinner-border text-secondary" role="status"></div>
                    <p class="mt-2 text-secondary">Loading archived posts...</p>
                </div>
            `;

            // Get filter from referrer
            currentFilter = getFilterFromReferrer();
            updateHeader(currentFilter);

            // Load from archive-posts node
            firebase.database().ref('archive-posts')
                .orderByChild('archivedAt')
                .once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    if (!data) {
                        allPosts = [];
                        filteredPosts = [];
                        renderArchive(1, searchTerm || '');
                        return;
                    }
                    const keys = Object.keys(data);
                    const posts = keys.map(key => ({ ...data[key], id: key }));
                    // Sort by archivedAt descending (newest archived first)
                    posts.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
                    allPosts = posts;
                    renderArchive(1, searchTerm || '');
                })
                .catch(err => {
                    console.error('Error loading archive:', err);
                    container.innerHTML = `
                        <div class="empty-state text-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            <h4 class="mt-3">Error Loading</h4>
                            <p>Could not fetch archived posts. Please refresh the page.</p>
                        </div>
                    `;
                    document.getElementById('paginationControls').innerHTML = '';
                });
        }

        // ============================================
        // 4. SEARCH HANDLER
        // ============================================
        function handleSearch() {
            const val = document.getElementById('searchInput').value;
            loadArchive(val);
        }

        // ============================================
        // 5. INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadArchive('');
            document.getElementById('searchBtn').addEventListener('click', handleSearch);
            document.getElementById('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') handleSearch();
            });
        });

        window.loadArchive = loadArchive;
    </script>
</body>
</html>
