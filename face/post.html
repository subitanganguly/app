<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post · THE INDIA FACE</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #f4f7fc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-top: 50px;
}
.page-header {
    background: linear-gradient(135deg, #0d6efd, #6f42c1);
    padding: 1rem 0;
    margin-bottom: 1rem;
    border-radius: 0 0 40px 40px;
    color: white;
    box-shadow: 0 8px 30px rgba(13, 110, 253, 0.2);
}
.page-header h1 {
    font-weight: 800;
    font-size: 2rem;
}
.post-content {
    background: white;
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.05);
}
.post-content .post-title {
    font-weight: 800;
    color: #0b1e33;
    font-size: 2rem;
}
.post-content .post-meta {
    color: #94a3b8;
    font-size: 0.9rem;
}
.post-content .post-body {
    color: #1e293b;
    font-size: 1.05rem;
    line-height: 1.8;
}
.post-content .post-body img {
    max-width: 100%;
    border-radius: 16px;
    margin: 0.5rem 0;
}
.media-grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
}
.media-grid-view .media-item {
    border-radius: 16px;
    overflow: hidden;
    background: #eef2f7;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #e9edf4;
}
.media-grid-view .media-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.media-grid-view .media-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.youtube-embed-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 16px;
    margin-top: 1rem;
}
.youtube-embed-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}
.back-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    border-radius: 40px;
    padding: 0.4rem 1.2rem;
    text-decoration: none;
    transition: 0.2s;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
    color: white;
}
footer{ background:#212529; color:#fff; } 
footer a{ color:#adb5bd; text-decoration:none; } 
footer a:hover{ color:#fff; }
@media (max-width: 576px) {
    .post-content { padding: 1.2rem; }
    .post-content .post-title { font-size: 1.4rem; }
    .media-grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>
<body>

<div id="navbar"></div>

<div class="page-header">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-file-text fs-1"></i>
                <div>
                    <h1 class="mb-0">Post</h1>
                    <p class="mb-0 opacity-75" id="postTypeLabel">Loading...</p>
                </div>
            </div>
            <a href="javascript:history.back()" class="back-btn"><i class="bi bi-arrow-left me-1"></i> Back</a>
        </div>
    </div>
</div>

<div class="container flex-grow-1 py-4">
    <div id="postContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-secondary">Loading post...</p>
        </div>
    </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/login.js"></script>
<script src="js/include.js"></script>
<script src="js/sg.js"></script>

<script>
// ============================================
// AUTH / NAVBAR
// ============================================
firebase.auth().onAuthStateChanged(function(user){
    const signInBtn = document.getElementById("signInBtn");
    const signUpBtn = document.getElementById("signUpBtn");
    const userArea = document.getElementById("userArea");
    const adminBtn = document.getElementById("adminBtn");

    if(!user){
        signInBtn.style.display = "inline-block";
        signUpBtn.style.display = "inline-block";
        userArea.style.display = "none";
        if(adminBtn) adminBtn.remove();
        return;
    }

    const name = localStorage.getItem("name");
    const type = localStorage.getItem("type");

    signInBtn.style.display = "none";
    signUpBtn.style.display = "none";
    userArea.style.display = "block";

    const initials = (name || "User")
        .trim()
        .split(" ")
        .map(n => n.charAt(0).toUpperCase())
        .join("");

    document.getElementById("userName").textContent = initials;

    if(type === "admin"){
        if(!adminBtn){
            const btn = document.createElement("a");
            btn.id = "adminBtn";
            btn.href = "ad-index.html";
            btn.className = "btn btn-danger btn-sm me-2";
            btn.innerHTML = '<i class="bi bi-shield-lock"></i> Admin';
            document.getElementById("authArea").insertBefore(btn, userArea);
        }
    }else{
        if(adminBtn) adminBtn.remove();
    }
});

// ============================================
// UTILITY FUNCTIONS
// ============================================
function extractGoogleDriveFileId(url) {
    if (!url) return null;
    const match1 = url.match(/\/file\/d\/([^\/]+)/);
    if (match1) return match1[1];
    const match2 = url.match(/[?&]id=([^&]+)/);
    if (match2) return match2[1];
    const match3 = url.match(/\/uc\?id=([^&]+)/);
    if (match3) return match3[1];
    return null;
}

function getGoogleDriveImageUrl(url, size = 'w800') {
    const fileId = extractGoogleDriveFileId(url);
    if (fileId) {
        return `https://drive.google.com/thumbnail?id=${fileId}&sz=${size}`;
    }
    return url;
}

function extractYouTubeId(url) {
    if (!url) return null;
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\?\/]+)/i,
        /youtube\.com\/shorts\/([^\/\?]+)/i
    ];
    for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
    }
    return null;
}

// ============================================
// LOAD POST
// ============================================
function loadPost() {
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    
    if (!postId) {
        document.getElementById('postContainer').innerHTML = `
            <div class="text-center py-5 text-danger">
                <i class="bi bi-exclamation-triangle fs-1"></i>
                <h4 class="mt-3">No Post ID Specified</h4>
                <p>Please provide a valid post ID.</p>
            </div>
        `;
        return;
    }
    
    const container = document.getElementById('postContainer');
    const typeLabel = document.getElementById('postTypeLabel');
    
    firebase.database().ref('posts/' + postId).once('value')
        .then(snapshot => {
            const post = snapshot.val();
            if (!post) {
                container.innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <i class="bi bi-file-text fs-1"></i>
                        <h4 class="mt-3">Post Not Found</h4>
                        <p>The post you're looking for doesn't exist or has been removed.</p>
                    </div>
                `;
                typeLabel.textContent = 'Not Found';
                return;
            }
            
            const type = post.type || 'post';
            const title = post.title || 'Untitled';
            const date = post.date || '';
            const description = post.description || '';
            const mediaUrls = post.mediaUrls || [];
            const youtubeUrls = post.youtubeUrls || [];
            const pdfUrl = post.pdfUrl || '';
            
            typeLabel.textContent = type.charAt(0).toUpperCase() + type.slice(1);
            
            let mediaHtml = '';
            
            // Images
            if (mediaUrls.length > 0) {
                mediaHtml += `<div class="media-grid-view">`;
                mediaUrls.forEach(url => {
                    const displayUrl = getGoogleDriveImageUrl(url, 'w600');
                    mediaHtml += `
                        <div class="media-item">
                            <img src="${displayUrl}" alt="media" loading="lazy"
                                 onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;\\'>📷</div>'">
                        </div>
                    `;
                });
                mediaHtml += `</div>`;
            }
            
            // YouTube videos
            if (youtubeUrls.length > 0) {
                youtubeUrls.forEach(url => {
                    const videoId = extractYouTubeId(url);
                    if (videoId) {
                        mediaHtml += `
                            <div class="youtube-embed-wrapper">
                                <iframe src="https://www.youtube.com/embed/${videoId}?rel=0" 
                                        allow="autoplay; encrypted-media; fullscreen" 
                                        allowfullscreen></iframe>
                            </div>
                        `;
                    }
                });
            }
            
            // PDF link
            let pdfHtml = '';
            if (pdfUrl) {
                pdfHtml = `
                    <a href="${pdfUrl}" target="_blank" class="btn btn-danger mt-3">
                        <i class="bi bi-file-pdf me-2"></i> Download PDF
                    </a>
                `;
            }
            
            container.innerHTML = `
                <div class="post-content">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                        <span class="badge bg-secondary">${type}</span>
                        ${date ? `<span class="text-secondary"><i class="bi bi-calendar3 me-1"></i>${date}</span>` : ''}
                    </div>
                    <h1 class="post-title">${title}</h1>
                    ${description ? `<div class="post-body mt-3">${description}</div>` : ''}
                    ${mediaHtml}
                    ${pdfHtml}
                </div>
            `;
        })
        .catch(err => {
            console.error('Error loading post:', err);
            container.innerHTML = `
                <div class="text-center py-5 text-danger">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                    <h4 class="mt-3">Error Loading Post</h4>
                    <p>${err.message}</p>
                </div>
            `;
        });
}

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', loadPost);
</script>

</body>
</html>
