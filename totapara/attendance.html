<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Search bar styling */
        .search-wrapper {
            position: relative;
            width: 260px;
        }
        .search-wrapper .bi-search {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
        }
        .search-wrapper input {
            padding-left: 36px;
            border-radius: 20px;
            font-size: 14px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            transition: all 0.3s;
            height: 34px;
        }
        .search-wrapper input:focus {
            background: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        /* Print receipt styling */
        .print-receipt {
            max-width: 80mm;
            margin: 0 auto;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .print-receipt .receipt-header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .print-receipt .receipt-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        .print-receipt .receipt-total {
            border-top: 1px dashed #000;
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #receiptPrintArea, #receiptPrintArea * {
                visibility: visible;
            }
            #receiptPrintArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: white;
            }
        }

        @media (max-width: 768px) {
            .search-wrapper {
                width: 100%;
            }
        }
    </style>

</head>


<body>


    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>


    <div class="main-wrapper">


        <!-- PAGE CONTENT -->

        <main class="container-fluid p-4">


            <!-- HEADER -->

                <div>

    <script>
        // =====================================================
        // ATTENDANCE MANAGEMENT
        // =====================================================

        const EMPLOYEE_STORE = STORES.EMPLOYEES;
        const PROJECT_STORE = STORES.PROJECTS;
        const PHASE_STORE = STORES.PHASES;
        const ATTENDANCE_STORE = STORES.ATTENDANCE;
        const SALARY_SETTINGS_STORE = STORES.SALARY_SETTINGS;

        // Store attendance data
        let attendanceData = {};
        let attendanceProgressValues = {};
        let attendanceSalaryAmounts = {};
        let currentEmployees = [];
        let filteredEmployees = [];
        let currentProjectId = null;
        let currentDate = null;
        let currentPhaseId = null;
        let currentMode = 'without';
        let isSaving = false;
        let pendingPhaseWiseEmployee = null;
        let modalInstance = null;
        let currentSalarySettings = [];
        let lastBreakdownResult = null;
        let currentSearchTerm = '';


        // =====================================================
        // GET ALL PROJECTS
        // =====================================================

        async function getProjects() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(PROJECT_STORE, "readonly");
                const store = transaction.objectStore(PROJECT_STORE);
                const request = store.getAll();
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // GET ALL PHASES
        // =====================================================

        async function getPhases() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(PHASE_STORE, "readonly");
                    const store = transaction.objectStore(PHASE_STORE);
                    const request = store.getAll();
                    request.onsuccess = function() { resolve(request.result); };
                    request.onerror = function() { reject(request.error); };
                    transaction.oncomplete = function() { db.close(); };
                });
            } catch (error) {
                console.error("Error getting phases:", error);
                return [];
            }
        }


        // =====================================================
        // GET ALL EMPLOYEES
        // =====================================================

        async function getAllEmployees() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(EMPLOYEE_STORE, "readonly");
                const store = transaction.objectStore(EMPLOYEE_STORE);
                const request = store.getAll();
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // GET SALARY SETTINGS BY PROJECT
        // =====================================================

        async function getSalarySettings(projectId) {
            try {
                const db = await openDB();
                if (!db.objectStoreNames.contains(SALARY_SETTINGS_STORE)) {
                    db.close();
                    return [];
                }
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(SALARY_SETTINGS_STORE, "readonly");
                    const store = transaction.objectStore(SALARY_SETTINGS_STORE);
                    const index = store.index('projectId');
                    const request = index.getAll(parseInt(projectId));
                    request.onsuccess = function() { resolve(request.result || []); };
                    request.onerror = function() { reject(request.error); };
                    transaction.oncomplete = function() { db.close(); };
                });
            } catch (error) {
                console.error('Error getting salary settings:', error);
                return [];
            }
        }


        // =====================================================
        // GET ATTENDANCE BY DATE AND PROJECT (without phase)
        // =====================================================

        async function getAttendanceByDateAndProject(projectId, date) {
            try {
                const db = await openDB();
                if (!db.objectStoreNames.contains(ATTENDANCE_STORE)) {
                    db.close();
                    return null;
                }
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(ATTENDANCE_STORE, 'readonly');
                    const store = transaction.objectStore(ATTENDANCE_STORE);
                    const index = store.index('projectDatePhase');
                    const range = IDBKeyRange.only([parseInt(projectId), date, 0]);
                    const request = index.get(range);
                    request.onsuccess = function() { resolve(request.result || null); };
                    request.onerror = function() { reject(request.error); };
                    transaction.oncomplete = function() { db.close(); };
                });
            } catch (error) {
                console.error('Error getting attendance:', error);
                return null;
            }
        }


        // =====================================================
        // GET ATTENDANCE BY DATE, PROJECT AND PHASE
        // =====================================================

        async function getAttendanceByDateAndPhase(projectId, date, phaseId) {
            try {
                const db = await openDB();
                if (!db.objectStoreNames.contains(ATTENDANCE_STORE)) {
                    db.close();
                    return null;
                }
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(ATTENDANCE_STORE, 'readonly');
                    const store = transaction.objectStore(ATTENDANCE_STORE);
                    const index = store.index('projectDatePhase');
                    const range = IDBKeyRange.only([parseInt(projectId), date, parseInt(phaseId)]);
                    const request = index.get(range);
                    request.onsuccess = function() { resolve(request.result || null); };
                    request.onerror = function() { reject(request.error); };
                    transaction.oncomplete = function() { db.close(); };
                });
            } catch (error) {
                console.error('Error getting attendance:', error);
                return null;
            }
        }


        // =====================================================
        // SAVE ATTENDANCE TO DATABASE
        // =====================================================

        async function saveAttendanceToDB(attendanceRecord) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(ATTENDANCE_STORE, 'readwrite');
                const store = transaction.objectStore(ATTENDANCE_STORE);

                const index = store.index('projectDatePhase');
                const range = IDBKeyRange.only([
                    attendanceRecord.projectId,
                    attendanceRecord.date,
                    attendanceRecord.phaseId
                ]);
                const getRequest = index.get(range);

                getRequest.onsuccess = function() {
                    const existingRecord = getRequest.result;
                    if (existingRecord) {
                        attendanceRecord.id = existingRecord.id;
                        attendanceRecord.updatedAt = new Date().toISOString();
                        const putRequest = store.put(attendanceRecord);
                        putRequest.onsuccess = () => resolve(attendanceRecord);
                        putRequest.onerror = () => reject(putRequest.error);
                    } else {
                        attendanceRecord.createdAt = new Date().toISOString();
                        attendanceRecord.updatedAt = new Date().toISOString();
                        const addRequest = store.add(attendanceRecord);
                        addRequest.onsuccess = () => resolve(attendanceRecord);
                        addRequest.onerror = () => reject(addRequest.error);
                    }
                };

                getRequest.onerror = function() { reject(getRequest.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // CALCULATE PHASE SALARY - SLAB WISE
        // =====================================================

        function calculatePhaseSalary(value, settings) {

            if (!settings || settings.length === 0) {
                return {
                    totalSalary: 0,
                    breakdown: [],
                    noRules: true,
                    equalityMatch: false
                };
            }

            value = parseFloat(value);

            if (isNaN(value) || value <= 0) {
                return {
                    totalSalary: 0,
                    breakdown: [],
                    noRules: true,
                    equalityMatch: false
                };
            }

            let totalSalary = 0;
            let breakdown = [];

            const rules = settings
                .map(setting => {
                    const valueName = setting.valueName || '';
                    const match = valueName.match(/([\d.]+)/);

                    if (!match) return null;

                    return {
                        threshold: parseFloat(match[1]),
                        condition: setting.condition || 'greater',
                        rate: parseFloat(setting.rate) || 0,
                        valueName: valueName
                    };
                })
                .filter(rule => rule && rule.rate >= 0)
                .sort((a, b) => a.threshold - b.threshold);


            if (rules.length === 0) {
                return {
                    totalSalary: 0,
                    breakdown: [],
                    noRules: true,
                    equalityMatch: false
                };
            }

            let lessRule = null;
            let equalRule = null;
            let greaterRule = null;

            rules.forEach(rule => {
                if (rule.condition === 'less') {
                    lessRule = rule;
                } else if (rule.condition === 'equal') {
                    equalRule = rule;
                } else if (rule.condition === 'greater') {
                    greaterRule = rule;
                }
            });


            // EXACT EQUALITY
            if (equalRule && value === equalRule.threshold) {
                const amount = value * equalRule.rate;
                totalSalary += amount;
                breakdown.push({
                    condition: 'equal',
                    threshold: equalRule.threshold,
                    rate: equalRule.rate,
                    quantity: value,
                    calculatedAmount: amount,
                    valueName: equalRule.valueName,
                    displayText: `${value} × ₹${equalRule.rate.toFixed(2)} = ₹${amount.toFixed(2)}`
                });

                return {
                    totalSalary,
                    breakdown,
                    noRules: false,
                    equalityMatch: true
                };
            }


            // VALUE BELOW THRESHOLD
            if (lessRule && value < lessRule.threshold) {
                const amount = value * lessRule.rate;
                totalSalary += amount;
                breakdown.push({
                    condition: 'less',
                    threshold: lessRule.threshold,
                    rate: lessRule.rate,
                    quantity: value,
                    calculatedAmount: amount,
                    valueName: lessRule.valueName,
                    displayText: `${value} × ₹${lessRule.rate.toFixed(2)} = ₹${amount.toFixed(2)}`
                });

                return {
                    totalSalary,
                    breakdown,
                    noRules: false,
                    equalityMatch: false
                };
            }


            // VALUE GREATER THAN THRESHOLD
            if (greaterRule && value > greaterRule.threshold) {
                const baseQuantity = greaterRule.threshold;
                const extraQuantity = value - baseQuantity;

                if (lessRule) {
                    const firstRate = lessRule.rate;
                    const firstAmount = baseQuantity * firstRate;
                    totalSalary += firstAmount;
                    breakdown.push({
                        condition: 'less',
                        threshold: baseQuantity,
                        rate: firstRate,
                        quantity: baseQuantity,
                        calculatedAmount: firstAmount,
                        valueName: lessRule.valueName,
                        displayText: `${baseQuantity} × ₹${firstRate.toFixed(2)} = ₹${firstAmount.toFixed(2)}`
                    });
                }

                const extraAmount = extraQuantity * greaterRule.rate;
                totalSalary += extraAmount;
                breakdown.push({
                    condition: 'greater',
                    threshold: greaterRule.threshold,
                    rate: greaterRule.rate,
                    quantity: extraQuantity,
                    calculatedAmount: extraAmount,
                    valueName: greaterRule.valueName,
                    displayText: `${extraQuantity} × ₹${greaterRule.rate.toFixed(2)} = ₹${extraAmount.toFixed(2)}`
                });

                return {
                    totalSalary,
                    breakdown,
                    noRules: false,
                    equalityMatch: false
                };
            }

            return {
                totalSalary: 0,
                breakdown: [],
                noRules: true,
                equalityMatch: false
            };
        }


        // =====================================================
        // PRINT RECEIPT (Phase Wise)
        // =====================================================

        function printReceipt(employee, value, salary, breakdownResult) {
            const printArea = document.getElementById('receiptPrintArea');
            const phaseName = document.getElementById('modalPhaseName').value;
            const appName = (typeof APP_NAME !== 'undefined' ? APP_NAME : 'Tea Estate Management');

            let breakdownText = '';
            if (breakdownResult && breakdownResult.breakdown && breakdownResult.breakdown.length > 0) {
                breakdownResult.breakdown.forEach(item => {
                    breakdownText += `<div class="receipt-item"><span>${item.displayText}</span></div>`;
                });
            }

            printArea.innerHTML = `
                <div class="print-receipt">
                    <div class="receipt-header">
                        <h5>${appName}</h5>
                        <div>Attendance Receipt</div>
                        <div style="font-size:10px;color:#666;">${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}</div>
                    </div>
                    <div class="receipt-item"><span>Employee</span><span>${employee.name}</span></div>
                    <div class="receipt-item"><span>Code</span><span>${employee.employeeId || 'N/A'}</span></div>
                    <div class="receipt-item"><span>Phase</span><span>${phaseName}</span></div>
                    <div class="receipt-item"><span>Value Collected</span><span>${value}</span></div>
                    ${breakdownText ? `<div style="margin-top:8px;border-top:1px dashed #ddd;padding-top:8px;">${breakdownText}</div>` : ''}
                    <div class="receipt-total">
                        <div class="receipt-item"><span>Total Salary</span><span>₹${salary.toFixed(2)}</span></div>
                    </div>
                    <div style="text-align:center;margin-top:15px;font-size:10px;color:#999;border-top:1px dashed #ddd;padding-top:10px;">
                        Thank you!
                    </div>
                </div>
            `;

            printArea.style.display = 'block';
            setTimeout(() => {
                window.print();
                setTimeout(() => {
                    printArea.style.display = 'none';
                }, 1000);
            }, 500);
        }


        // =====================================================
        // LOAD PROJECTS INTO SELECT
        // =====================================================

        async function loadProjects() {
            try {
                const projects = await getProjects();
                const select = document.getElementById('attendanceProject');
                const currentValue = select.value;

                select.innerHTML = '<option value="">-- Select Project --</option>';

                if (projects.length === 0) {
                    select.innerHTML += '<option value="" disabled>No projects available</option>';
                } else {
                    projects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.id;
                        option.textContent = project.name;
                        select.appendChild(option);
                    });
                }

                if (currentValue && projects.some(p => p.id == currentValue)) {
                    select.value = currentValue;
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }


        // =====================================================
        // LOAD PHASES INTO SELECT
        // =====================================================

        async function loadPhases() {
            try {
                const phases = await getPhases();
                const select = document.getElementById('attendancePhase');
                const currentValue = select.value;

                select.innerHTML = '<option value="">-- Select Phase --</option>';

                if (phases.length === 0) {
                    select.innerHTML += '<option value="" disabled>No phases available</option>';
                } else {
                    phases.forEach(phase => {
                        const option = document.createElement('option');
                        option.value = phase.id;
                        option.textContent = `${phase.name} (${phase.time || '--:--'})`;
                        select.appendChild(option);
                    });
                }

                if (currentValue && phases.some(p => p.id == currentValue)) {
                    select.value = currentValue;
                }
            } catch (error) {
                console.error('Error loading phases:', error);
            }
        }


        // =====================================================
        // SET DEFAULT DATE
        // =====================================================

        function setDefaultDate() {
            const dateInput = document.getElementById('attendanceDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }


        // =====================================================
        // TOGGLE PHASE SECTION
        // =====================================================

        function togglePhaseSection() {
            const mode = document.getElementById('attendanceMode').value;
            const phaseSection = document.getElementById('phaseSection');
            const modeBadge = document.getElementById('attendanceModeBadge');

            if (mode === 'phasewise') {
                phaseSection.style.display = 'block';
                modeBadge.className = 'badge bg-success';
                modeBadge.innerHTML = '<i class="bi bi-diagram-3 me-1"></i> Phase Wise';
            } else {
                phaseSection.style.display = 'none';
                modeBadge.className = 'badge bg-info';
                modeBadge.innerHTML = '<i class="bi bi-calendar3 me-1"></i> Without Phase';
                document.getElementById('attendancePhase').value = '';
            }
            currentMode = mode;
            loadEmployeesForAttendance();
        }


        // =====================================================
        // OPEN PHASE WISE MODAL
        // =====================================================

        function openPhaseWiseModal(employeeId) {
            const employee = currentEmployees.find(e => e.id === employeeId);
            if (!employee) return;

            pendingPhaseWiseEmployee = employee;

            const phaseSelect = document.getElementById('attendancePhase');
            const phaseName = phaseSelect.options[phaseSelect.selectedIndex]?.text || '';

            document.getElementById('modalEmployeeName').value = employee.name;
            document.getElementById('modalPhaseName').value = phaseName;
            document.getElementById('modalValue').value = '';
            document.getElementById('modalSalary').value = '';
            document.getElementById('modalError').textContent = '';
            document.getElementById('modalBreakdown').style.display = 'none';
            document.getElementById('printSlipBtn').style.display = 'none';
            lastBreakdownResult = null;

            if (!modalInstance) {
                modalInstance = new bootstrap.Modal(document.getElementById('phaseWiseModal'));
            }
            modalInstance.show();

            setTimeout(() => {
                document.getElementById('modalValue').focus();
            }, 300);
        }


        // =====================================================
        // CALCULATE SALARY IN MODAL
        // =====================================================

        async function calculateSalaryInModal() {
            const valueInput = document.getElementById('modalValue');
            const salaryInput = document.getElementById('modalSalary');
            const errorDiv = document.getElementById('modalError');
            const breakdownDiv = document.getElementById('modalBreakdown');
            const breakdownContent = document.getElementById('modalBreakdownContent');
            const printBtn = document.getElementById('printSlipBtn');

            const value = parseFloat(valueInput.value);
            if (isNaN(value) || value <= 0) {
                salaryInput.value = '';
                errorDiv.textContent = 'Please enter a valid value.';
                breakdownDiv.style.display = 'none';
                printBtn.style.display = 'none';
                lastBreakdownResult = null;
                return;
            }

            errorDiv.textContent = '';

            const projectId = document.getElementById('attendanceProject').value;
            if (!projectId) {
                salaryInput.value = '';
                errorDiv.textContent = 'No project selected.';
                breakdownDiv.style.display = 'none';
                printBtn.style.display = 'none';
                lastBreakdownResult = null;
                return;
            }

            try {
                const settings = await getSalarySettings(projectId);
                currentSalarySettings = settings;
                const result = calculatePhaseSalary(value, settings);
                lastBreakdownResult = result;

                if (result.totalSalary === 0 && settings.length > 0) {
                    errorDiv.textContent = '⚠️ No salary rules matched this value. Salary will be ₹0.00';
                } else {
                    errorDiv.textContent = '';
                }

                salaryInput.value = '₹ ' + result.totalSalary.toFixed(2);

                if (result.totalSalary > 0) {
                    printBtn.style.display = 'inline-block';
                } else {
                    printBtn.style.display = 'none';
                }

                if (result.breakdown && result.breakdown.length > 0) {
                    let breakdownHtml = '<div class="small">';
                    breakdownHtml += '<div class="fw-bold mb-1">Applied Rules:</div>';
                    result.breakdown.forEach((item, index) => {
                        breakdownHtml += `<div class="d-flex justify-content-between py-1 border-bottom">`;
                        breakdownHtml += `<span>${index + 1}. ${item.displayText}</span>`;
                        breakdownHtml += `</div>`;
                    });
                    breakdownHtml += `<div class="fw-bold mt-1">Total: ₹${result.totalSalary.toFixed(2)}</div>`;
                    breakdownHtml += '</div>';
                    breakdownContent.innerHTML = breakdownHtml;
                    breakdownDiv.style.display = 'block';
                } else {
                    breakdownDiv.style.display = 'none';
                }

            } catch (error) {
                console.error('Error calculating salary:', error);
                salaryInput.value = '';
                errorDiv.textContent = 'Error calculating salary. Please check settings.';
                breakdownDiv.style.display = 'none';
                printBtn.style.display = 'none';
                lastBreakdownResult = null;
            }
        }


        // =====================================================
        // SAVE PHASE WISE ATTENDANCE
        // =====================================================

        async function savePhaseWiseAttendance() {
            const valueInput = document.getElementById('modalValue');
            const salaryInput = document.getElementById('modalSalary');
            const errorDiv = document.getElementById('modalError');

            const value = parseFloat(valueInput.value);
            if (isNaN(value) || value <= 0) {
                errorDiv.textContent = 'Please enter a valid value.';
                valueInput.focus();
                return;
            }

            const salaryText = salaryInput.value;
            const salary = parseFloat(salaryText.replace('₹ ', '')) || 0;

            const employee = pendingPhaseWiseEmployee;
            if (!employee) {
                errorDiv.textContent = 'Employee not found.';
                return;
            }

            attendanceProgressValues[employee.id] = value.toString();
            attendanceSalaryAmounts[employee.id] = salary;
            attendanceData[employee.id] = 'present';

            if (modalInstance) {
                modalInstance.hide();
            }

            updateSummary();
            updateButtonStyles(employee.id, 'present');
            renderEmployeeList();

            await autoSaveAttendance();

            const indicator = document.getElementById('autoSaveIndicator');
            indicator.style.display = 'inline';
            setTimeout(() => { indicator.style.display = 'none'; }, 3000);
        }


        // =====================================================
        // SET ATTENDANCE
        // =====================================================

        function setAttendance(employeeId, status) {
            const employee = currentEmployees.find(e => e.id === employeeId);

            if (status === 'present' && employee && employee.type === 'Phase Wise') {
                openPhaseWiseModal(employeeId);
                return;
            }

            if (status === 'present' && employee && employee.designationProgress === 'Yes') {
                const existingValue = attendanceProgressValues[employeeId];
                if (!existingValue) {
                    const container = document.getElementById(`progress_${employeeId}`);
                    if (container) {
                        container.style.display = 'inline-block';
                        const input = container.querySelector('input');
                        if (input) input.focus();
                    }
                    attendanceData[employeeId] = 'pending';
                    updateSummary();
                    updateButtonStyles(employeeId, 'pending');
                    return;
                }
            }

            if (status !== 'present') {
                attendanceProgressValues[employeeId] = '';
                attendanceSalaryAmounts[employeeId] = 0;
                const container = document.getElementById(`progress_${employeeId}`);
                if (container) {
                    container.style.display = 'none';
                    const input = container.querySelector('input');
                    if (input) input.value = '';
                }
            }

            attendanceData[employeeId] = status;
            updateSummary();
            updateButtonStyles(employeeId, status);
            autoSaveAttendance();
        }


        // =====================================================
        // SET PROGRESS VALUE
        // =====================================================

        function setProgressValue(employeeId) {
            const container = document.getElementById(`progress_${employeeId}`);
            const input = container.querySelector('input');
            const value = input.value.trim();

            if (!value) {
                alert('Please enter a progress value.');
                input.focus();
                return;
            }

            attendanceProgressValues[employeeId] = value;
            attendanceData[employeeId] = 'present';
            container.style.display = 'none';
            updateSummary();
            updateButtonStyles(employeeId, 'present');

            const item = document.querySelector(`.employee-item[data-id="${employeeId}"]`);
            if (item) {
                const nameDiv = item.querySelector('.employee-name');
                const existingDisplay = nameDiv.querySelector('.progress-display');
                if (existingDisplay) existingDisplay.remove();

                const progressDisplay = document.createElement('span');
                progressDisplay.className = 'badge bg-info ms-1 progress-display';
                progressDisplay.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> ${escapeHTML(value)}`;
                nameDiv.appendChild(progressDisplay);
            }

            autoSaveAttendance();
        }


        // =====================================================
        // UPDATE BUTTON STYLES
        // =====================================================

        function updateButtonStyles(employeeId, status) {
            const item = document.querySelector(`.employee-item[data-id="${employeeId}"]`);
            if (item) {
                const buttons = item.querySelectorAll('.btn-status');
                buttons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.status === status) {
                        btn.classList.add('active');
                    }
                });

                const badgeSpan = item.querySelector('.status-badge');
                if (badgeSpan) {
                    let statusClass = 'secondary';
                    let statusText = 'Not marked';
                    if (status === 'present') { statusClass = 'success';
                        statusText = 'PRESENT'; } else if (status === 'absent') { statusClass = 'danger';
                        statusText = 'ABSENT'; } else if (status === 'leave') { statusClass = 'warning';
                        statusText = 'LEAVE'; }

                    badgeSpan.className = `badge bg-${statusClass} status-badge`;
                    badgeSpan.innerHTML =
                        `<span class="spinner-grow spinner-grow-sm me-1" style="display:${status === 'pending' ? 'inline-block' : 'none'}"></span> ${statusText}`;
                }
            }
        }


        // =====================================================
        // AUTO-SAVE ATTENDANCE
        // =====================================================

        async function autoSaveAttendance() {
            if (isSaving || currentEmployees.length === 0) return;

            const projectId = document.getElementById('attendanceProject').value;
            const date = document.getElementById('attendanceDate').value;
            const mode = document.getElementById('attendanceMode').value;
            let phaseId = 0;

            if (mode === 'phasewise') {
                phaseId = parseInt(document.getElementById('attendancePhase').value) || 0;
                if (!phaseId) return;
            }

            if (!projectId || !date) return;

            const missingProgress = currentEmployees.filter(emp => {
                if (emp.designationProgress === 'Yes' && attendanceData[emp.id] === 'present') {
                    return !attendanceProgressValues[emp.id];
                }
                return false;
            });

            if (missingProgress.length > 0) return;

            isSaving = true;

            try {
                const attendanceRecord = {
                    projectId: parseInt(projectId),
                    date: date,
                    phaseId: phaseId,
                    records: currentEmployees.map(emp => {
                        const status = attendanceData[emp.id] || 'pending';
                        const progressValue = (status === 'present' && attendanceProgressValues[emp.id]) ?
                            attendanceProgressValues[emp.id] : '';
                        const salaryAmount = (status === 'present' && attendanceSalaryAmounts[emp.id]) ?
                            attendanceSalaryAmounts[emp.id] : 0;

                        return {
                            employeeId: emp.id,
                            employeeName: emp.name,
                            employeeCode: emp.employeeId,
                            employeeType: emp.type || 'Daily',
                            designationProgress: emp.designationProgress || 'No',
                            status: status,
                            progressValue: progressValue,
                            progressValueName: emp.designationProgressValue || '',
                            salaryAmount: salaryAmount
                        };
                    }),
                    updatedAt: new Date().toISOString()
                };

                await saveAttendanceToDB(attendanceRecord);

                const indicator = document.getElementById('autoSaveIndicator');
                indicator.style.display = 'inline';
                setTimeout(() => { indicator.style.display = 'none'; }, 3000);

            } catch (error) {
                console.error('Auto-save error:', error);
            } finally {
                isSaving = false;
            }
        }


        // =====================================================
        // LOAD EMPLOYEES FOR ATTENDANCE
        // =====================================================

        async function loadEmployeesForAttendance() {
            const projectId = document.getElementById('attendanceProject').value;
            const date = document.getElementById('attendanceDate').value;
            const mode = document.getElementById('attendanceMode').value;
            let phaseId = 0;

            const container = document.getElementById('employeeListContainer');

            if (!projectId) {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-folder display-4 d-block mb-3 opacity-50"></i>
                        <h5>Select a Project</h5>
                        <p>Please select a project to load employees.</p>
                    </div>
                `;
                document.getElementById('summarySection').style.display = 'none';
                return;
            }

            if (!date) {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-calendar3 display-4 d-block mb-3 opacity-50"></i>
                        <h5>Select a Date</h5>
                        <p>Please select an attendance date.</p>
                    </div>
                `;
                document.getElementById('summarySection').style.display = 'none';
                return;
            }

            if (mode === 'phasewise') {
                phaseId = parseInt(document.getElementById('attendancePhase').value) || 0;
                if (!phaseId) {
                    container.innerHTML = `
                        <div class="text-center py-5 text-muted">
                            <i class="bi bi-clock display-4 d-block mb-3 opacity-50"></i>
                            <h5>Select a Phase</h5>
                            <p>Please select a phase for Phase Wise mode.</p>
                        </div>
                    `;
                    document.getElementById('summarySection').style.display = 'none';
                    return;
                }
            }

            currentProjectId = projectId;
            currentDate = date;
            currentPhaseId = phaseId;
            currentMode = mode;

            try {
                const allEmployees = await getAllEmployees();

                currentEmployees = allEmployees.filter(emp => {
                    if (!emp.projects || emp.projects.length === 0) return false;
                    const hasProject = emp.projects.some(p => p.id == projectId);
                    if (!hasProject) return false;

                    if (mode === 'phasewise') {
                        return emp.type === 'Phase Wise';
                    } else {
                        return emp.type !== 'Phase Wise';
                    }
                });

                attendanceData = {};
                attendanceProgressValues = {};
                attendanceSalaryAmounts = {};

                let existingAttendance = null;
                if (mode === 'phasewise') {
                    existingAttendance = await getAttendanceByDateAndPhase(projectId, date, phaseId);
                } else {
                    existingAttendance = await getAttendanceByDateAndProject(projectId, date);
                }

                if (existingAttendance) {
                    existingAttendance.records.forEach(record => {
                        attendanceData[record.employeeId] = record.status;
                        if (record.progressValue) {
                            attendanceProgressValues[record.employeeId] = record.progressValue;
                        }
                        if (record.salaryAmount) {
                            attendanceSalaryAmounts[record.employeeId] = record.salaryAmount;
                        }
                    });
                }

                // Reset search filter when new data loads
                currentSearchTerm = '';
                const searchInput = document.getElementById('employeeSearch');
                if (searchInput) searchInput.value = '';

                applySearchFilter();

                document.getElementById('summarySection').style.display = 'flex';
                renderEmployeeList();
                updateSummary();

            } catch (error) {
                console.error('Error loading employees:', error);
                container.innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <i class="bi bi-exclamation-triangle display-4 d-block mb-3"></i>
                        <h5>Error Loading</h5>
                        <p>${error.message || 'Please try again.'}</p>
                    </div>
                `;
            }
        }


        // =====================================================
        // APPLY SEARCH FILTER
        // =====================================================

        function applySearchFilter() {
            const term = currentSearchTerm.trim().toLowerCase();

            if (!term) {
                filteredEmployees = currentEmployees.slice();
            } else {
                filteredEmployees = currentEmployees.filter(emp => {
                    const name = (emp.name || '').toLowerCase();
                    const code = (emp.employeeId || '').toLowerCase();
                    const designation = (emp.designation || '').toLowerCase();
                    return name.includes(term) || code.includes(term) || designation.includes(term);
                });
            }
        }


        // =====================================================
        // RENDER EMPLOYEE LIST
        // =====================================================

        function renderEmployeeList() {
            const container = document.getElementById('employeeListContainer');
            const countBadge = document.getElementById('employeeListCount');

            const isSearching = currentSearchTerm.trim().length > 0;
            const employeesToShow = isSearching ? filteredEmployees : currentEmployees;

            if (isSearching) {
                countBadge.textContent = `${employeesToShow.length} / ${currentEmployees.length}`;
            } else {
                countBadge.textContent = currentEmployees.length;
            }

            if (currentEmployees.length === 0) {
                const mode = document.getElementById('attendanceMode').value;
                let message = 'No employees are assigned to this project.';
                if (mode === 'phasewise') {
                    message = 'No "Phase Wise" employees are assigned to this project.';
                } else {
                    message = 'No employees (excluding Phase Wise) are assigned to this project.';
                }
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-people display-4 d-block mb-3 opacity-50"></i>
                        <h5>No Employees Found</h5>
                        <p>${message}</p>
                    </div>
                `;
                return;
            }

            if (employeesToShow.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-search display-4 d-block mb-3 opacity-50"></i>
                        <h5>No Matching Employees</h5>
                        <p>No employees match your search "<strong>${escapeHTML(currentSearchTerm)}</strong>".</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="list-group list-group-flush">';

            employeesToShow.forEach((employee) => {
                const initial = employee.name ? employee.name.charAt(0).toUpperCase() : '?';
                const status = attendanceData[employee.id] || 'pending';
                const needsProgress = employee.designationProgress === 'Yes';
                const progressValue = attendanceProgressValues[employee.id] || '';
                const progressValueName = employee.designationProgressValue || '';
                const salaryAmount = attendanceSalaryAmounts[employee.id] || 0;

                let statusClass = 'secondary';
                let statusText = 'Not marked';
                if (status === 'present') { statusClass = 'success';
                    statusText = 'PRESENT'; } else if (status === 'absent') { statusClass = 'danger';
                    statusText = 'ABSENT'; } else if (status === 'leave') { statusClass = 'warning';
                    statusText = 'LEAVE'; }

                const progressBadge = needsProgress ?
                    `<span class="badge bg-success ms-1">✅ Needs Progress</span>` :
                    `<span class="badge bg-secondary ms-1">❌ No Progress</span>`;

                const progressDisplay = needsProgress && progressValue ?
                    `<span class="badge bg-info ms-1 progress-display"><i class="bi bi-check-circle-fill me-1"></i> ${escapeHTML(progressValue)}</span>` :
                    '';

                const valueNameLabel = needsProgress && progressValueName ?
                    `<small class="text-muted ms-1">(${escapeHTML(progressValueName)})</small>` :
                    '';

                const salaryDisplay = (employee.type === 'Phase Wise' && salaryAmount > 0) ?
                    `<span class="badge bg-success ms-1">₹ ${salaryAmount.toFixed(2)}</span>` :
                    (employee.type === 'Phase Wise' && status === 'present') ?
                    `<span class="badge bg-warning text-dark ms-1">₹ 0.00 (No rule matched)</span>` :
                    '';

                const typeBadge = employee.type === 'Phase Wise' ?
                    `<span class="badge bg-success ms-1">Phase Wise</span>` :
                    employee.type === 'Daily' ?
                    `<span class="badge bg-warning text-dark ms-1">Daily</span>` :
                    `<span class="badge bg-info ms-1">Monthly</span>`;

                html += `
                    <div class="list-group-item employee-item d-flex flex-wrap align-items-center gap-2" data-id="${employee.id}">
                        <div class="d-flex align-items-center gap-2 flex-shrink-0">
                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width:40px;height:40px;font-weight:bold;font-size:16px;">
                                ${escapeHTML(initial)}
                            </div>
                        </div>
                        <div class="flex-grow-1 min-w-0">
                            <div class="employee-name">
                                <strong>${escapeHTML(employee.name)}</strong>
                                ${typeBadge}
                                ${progressBadge}
                                ${valueNameLabel}
                                ${progressDisplay}
                                ${salaryDisplay}
                                <span class="badge bg-${statusClass} status-badge">
                                    <span class="spinner-grow spinner-grow-sm me-1" style="display:${status === 'pending' ? 'inline-block' : 'none'}"></span>
                                    ${statusText}
                                </span>
                            </div>
                            <div class="text-muted small">
                                <span><i class="bi bi-tag me-1"></i>${escapeHTML(employee.employeeId || 'N/A')}</span>
                                <span class="ms-2"><i class="bi bi-phone me-1"></i>${escapeHTML(employee.mobile || 'N/A')}</span>
                                <span class="ms-2"><i class="bi bi-briefcase me-1"></i>${escapeHTML(employee.designation || 'N/A')}</span>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-1 align-items-center">
                            <button class="btn btn-outline-success btn-sm btn-status ${status === 'present' ? 'active' : ''}" data-status="present" onclick="setAttendance(${employee.id}, 'present')">
                                <i class="bi bi-check-circle me-1"></i>Present
                            </button>
                            <button class="btn btn-outline-danger btn-sm btn-status ${status === 'absent' ? 'active' : ''}" data-status="absent" onclick="setAttendance(${employee.id}, 'absent')">
                                <i class="bi bi-x-circle me-1"></i>Absent
                            </button>
                            <button class="btn btn-outline-warning btn-sm btn-status ${status === 'leave' ? 'active' : ''}" data-status="leave" onclick="setAttendance(${employee.id}, 'leave')">
                                <i class="bi bi-clock-history me-1"></i>Leave
                            </button>
                            ${needsProgress && employee.type !== 'Phase Wise' ? `
                                <div class="progress-value-input" id="progress_${employee.id}" style="display:${status === 'present' && !progressValue ? 'inline-block' : 'none'};">
                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control form-control-sm" placeholder="Enter ${escapeHTML(progressValueName || 'progress')}" 
                                               value="${escapeHTML(progressValue)}"
                                               style="width:120px;"
                                               onkeypress="if(event.key==='Enter') setProgressValue(${employee.id})">
                                        <button class="btn btn-success btn-sm" onclick="setProgressValue(${employee.id})">
                                            <i class="bi bi-check"></i>
                                        </button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }


        // =====================================================
        // UPDATE SUMMARY
        // =====================================================

        function updateSummary() {
            let present = 0;
            let absent = 0;
            let leave = 0;

            currentEmployees.forEach(emp => {
                const status = attendanceData[emp.id] || 'pending';
                if (status === 'present') present++;
                else if (status === 'absent') absent++;
                else if (status === 'leave') leave++;
            });

            document.getElementById('totalCount').textContent = currentEmployees.length;
            document.getElementById('presentCount').textContent = present;
            document.getElementById('absentCount').textContent = absent;
            document.getElementById('leaveCount').textContent = leave;
        }


        // =====================================================
        // HTML ESCAPE
        // =====================================================

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }


        // =====================================================
        // INITIALIZE
        // =====================================================

        document.addEventListener("DOMContentLoaded", async function() {
            try {
                await loadSettings();
                await openDB();

                await loadProjects();
                await loadPhases();
                setDefaultDate();

                document.getElementById('attendanceMode').addEventListener('change', togglePhaseSection);
                document.getElementById('attendanceProject').addEventListener('change', loadEmployeesForAttendance);
                document.getElementById('attendanceDate').addEventListener('change', loadEmployeesForAttendance);
                document.getElementById('attendancePhase').addEventListener('change', loadEmployeesForAttendance);

                // SEARCH INPUT LISTENER
                const searchInput = document.getElementById('employeeSearch');
                searchInput.addEventListener('input', function() {
                    currentSearchTerm = this.value;
                    applySearchFilter();
                    renderEmployeeList();
                });

                // Modal events
                document.getElementById('modalValue').addEventListener('input', calculateSalaryInModal);
                document.getElementById('modalSaveBtn').addEventListener('click', savePhaseWiseAttendance);

                // PRINT SLIP BUTTON
                document.getElementById('printSlipBtn').addEventListener('click', function() {
                    const employee = pendingPhaseWiseEmployee;
                    const value = parseFloat(document.getElementById('modalValue').value);
                    const salaryText = document.getElementById('modalSalary').value;
                    const salary = parseFloat(salaryText.replace('₹ ', '')) || 0;

                    if (employee && value > 0) {
                        printReceipt(employee, value, salary, lastBreakdownResult);
                    }
                });

                // Close modal event
                document.getElementById('phaseWiseModal').addEventListener('hidden.bs.modal', function() {
                    pendingPhaseWiseEmployee = null;
                    document.getElementById('printSlipBtn').style.display = 'none';
                    lastBreakdownResult = null;
                });

                togglePhaseSection();

            } catch (error) {
