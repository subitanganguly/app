<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tea Estate Management</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* ============================================
           WELCOME SCREEN
           ============================================ */
        .welcome-screen {
            text-align: center;
            color: white;
            padding: 40px;
            animation: welcomeFadeIn 1s ease;
        }

        .welcome-screen .welcome-icon {
            font-size: 90px;
            display: inline-block;
            animation: bounceIn 1.2s ease, float 3s ease-in-out infinite 1.2s;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .welcome-screen h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
            animation: slideDown 0.8s ease 0.3s both;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .welcome-screen h1 .highlight {
            background: linear-gradient(135deg, #ffd93d, #ff9a3d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-screen p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 35px;
            animation: slideDown 0.8s ease 0.5s both;
        }

        .welcome-screen .btn-get-started {
            background: linear-gradient(135deg, #ffd93d, #ff9a3d);
            color: #764ba2;
            border: none;
            border-radius: 50px;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            animation: slideUp 0.8s ease 0.7s both;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .welcome-screen .btn-get-started::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: left 0.6s;
        }

        .welcome-screen .btn-get-started:hover::before {
            left: 100%;
        }

        .welcome-screen .btn-get-started:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .welcome-screen .btn-get-started:active {
            transform: translateY(-1px) scale(1.02);
        }

        .welcome-screen .btn-get-started i {
            margin-left: 8px;
            transition: transform 0.3s;
        }

        .welcome-screen .btn-get-started:hover i {
            transform: translateX(5px);
        }

        /* Floating decorative dots */
        .welcome-screen .dot {
            position: absolute;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            animation: floatDot 6s ease-in-out infinite;
        }

        /* ============================================
           LOGIN CARD (hidden initially)
           ============================================ */
        .login-wrapper {
            display: none;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper.show {
            display: flex;
            animation: welcomeFadeIn 0.6s ease;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            animation: slideUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .icon {
            font-size: 48px;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 15px;
            border-radius: 50%;
            display: inline-block;
        }

        .login-header h4 {
            margin-top: 15px;
            font-weight: 600;
            color: #2d3748;
        }

        .login-header p {
            color: #718096;
            font-size: 14px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .form-label {
            font-weight: 500;
            color: #2d3748;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 10px;
            display: none;
        }

        .input-group-text {
            background: transparent;
            border: 2px solid #e2e8f0;
            border-right: none;
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }

        .input-group-text i {
            color: #718096;
        }

        .demo-credentials {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #4a5568;
        }

        .demo-credentials strong {
            color: #2d3748;
        }

        .demo-credentials code {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* ============================================
           ANIMATIONS
           ============================================ */
        @keyframes welcomeFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes floatDot {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.15;
            }
            50% {
                transform: translateY(-40px) scale(1.3);
                opacity: 0.3;
            }
        }

        /* Fade out animation for welcome screen */
        .welcome-screen.fade-out {
            animation: welcomeFadeOut 0.5s ease forwards;
        }

        @keyframes welcomeFadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 576px) {
            .welcome-screen h1 {
                font-size: 28px;
            }
            .welcome-screen .welcome-icon {
                font-size: 60px;
            }
            .welcome-screen p {
                font-size: 15px;
            }
            .welcome-screen .btn-get-started {
                padding: 12px 35px;
                font-size: 16px;
            }
            .login-card {
                padding: 25px;
                margin: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
         WELCOME SCREEN
         ============================================ -->
    <div class="welcome-screen" id="welcomeScreen">
        <!-- Decorative floating dots -->
        <div class="dot" style="width:80px;height:80px;top:10%;left:8%;animation-delay:0s;"></div>
        <div class="dot" style="width:120px;height:120px;top:60%;left:5%;animation-delay:1s;"></div>
        <div class="dot" style="width:60px;height:60px;top:20%;right:10%;animation-delay:2s;"></div>
        <div class="dot" style="width:100px;height:100px;bottom:15%;right:8%;animation-delay:1.5s;"></div>
        <div class="dot" style="width:50px;height:50px;bottom:30%;left:20%;animation-delay:2.5s;"></div>

        <div class="welcome-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>
        <h1>Welcome to <span class="highlight">Totapara Tea Estate</span></h1>
        <p>Manage attendance, employees, and salary — all in one place.</p>
        <button class="btn-get-started" id="getStartedBtn">
            Get Started <i class="bi bi-arrow-right"></i>
        </button>
    </div>

    <!-- ============================================
         LOGIN WRAPPER (hidden initially)
         ============================================ -->
    <div class="login-wrapper" id="loginWrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="icon">
                    <i class="bi bi-cup-hot"></i>
                </div>
                <h4>Tea Estate Management</h4>
                <p>Sign in to your account</p>
            </div>

            <div id="loginError" class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span id="errorMessage">Invalid credentials. Please try again.</span>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person me-1"></i>User ID</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="userId" class="form-control" placeholder="Enter User ID" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter Password" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="demo-credentials">
                <i class="bi bi-info-circle me-1"></i>
                <strong>Demo Credentials:</strong><br>
                User ID: <code>TPTE0001</code> &nbsp;|&nbsp; Password: <code>admin</code>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <!-- Include Database -->
    <script src="js/include.js"></script>
    <script src="js/db.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            const currentUser = sessionStorage.getItem('currentUser');
            if (currentUser) {
                window.location.href = 'index.html';
                return;
            }

            const welcomeScreen = document.getElementById('welcomeScreen');
            const loginWrapper = document.getElementById('loginWrapper');
            const getStartedBtn = document.getElementById('getStartedBtn');
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const errorMessage = document.getElementById('errorMessage');

            // ============================================
            // GET STARTED BUTTON - Switch to login
            // ============================================
            getStartedBtn.addEventListener('click', function() {
                // Fade out welcome screen
                welcomeScreen.classList.add('fade-out');

                setTimeout(() => {
                    welcomeScreen.style.display = 'none';
                    loginWrapper.classList.add('show');

                    // Focus on userId input after showing login
                    setTimeout(() => {
                        const userIdInput = document.getElementById('userId');
                        if (userIdInput) userIdInput.focus();
                    }, 100);
                }, 500);
            });

            // ============================================
            // LOGIN FORM SUBMISSION
            // ============================================
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const userId = document.getElementById('userId').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!userId || !password) {
                    showError('Please enter both User ID and Password');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="bi bi-spinner bi-spin me-2"></i>Signing in...';

                try {
                    const user = await authenticateUser(userId, password);
                    
                    if (user) {
                        // Store user in session
                        const sessionUser = {
                            id: user.id,
                            userId: user.userId,
                            isAdmin: user.isAdmin
                        };
                        sessionStorage.setItem('currentUser', JSON.stringify(sessionUser));
                        
                        // Redirect to dashboard
                        window.location.href = 'index.html';
                    } else {
                        showError('Invalid User ID or Password. Please try again.');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('An error occurred during login. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
                }
            });

            function showError(message) {
                errorMessage.textContent = message;
                loginError.style.display = 'block';
                setTimeout(() => {
                    loginError.style.display = 'none';
                }, 5000);
            }

            // Enter key support
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>

</body>
</html>
