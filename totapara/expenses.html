<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .expense-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }
        .expense-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .expense-card .card-header {
            background: transparent;
            border-bottom: 1px solid #eef2f6;
            padding: 1rem 1.5rem;
            font-weight: 600;
        }
        .expense-card .card-body {
            padding: 1.5rem;
        }
        .stat-box {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s;
        }
        .stat-box:hover {
            background: #e7f1ff;
            border-color: #0d6efd;
        }
        .stat-box .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }
        .stat-box .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 2px;
        }
        .stat-box .stat-icon {
            font-size: 18px;
            margin-right: 5px;
        }
        .stat-box.total .stat-number { color: #0d6efd; }
        .stat-box.daily .stat-number { color: #28a745; }
        .stat-box.monthly .stat-number { color: #ffc107; }
        .expense-item {
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        .expense-item:hover {
            background: #f8f9fa;
        }
        .expense-item:last-child {
            border-bottom: none;
        }
        .expense-amount {
            font-weight: 600;
            font-size: 16px;
            color: #dc3545;
        }
    </style>

</head>


<body>


    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>


    <div class="main-wrapper">


        <!-- PAGE CONTENT -->

        <main class="container-fluid p-4">


            <!-- HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h3 class="mb-1">
                        <i class="bi bi-wallet2 text-primary me-2"></i>Expenses
                    </h3>
                    <p class="text-muted mb-0">
                        Manage project-wise expenses
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#expenseModal">

                    <i class="bi bi-plus-lg me-1"></i> Add Expense

                </button>

            </div>


            <!-- SUMMARY SECTION -->

            <div class="row g-3 mb-4" id="summarySection">

                <div class="col-md-4 col-6">
                    <div class="stat-box total">
                        <div class="stat-number" id="totalExpenses">0</div>
                        <div class="stat-label"><i class="bi bi-currency-rupee stat-icon"></i>Total</div>
                    </div>
                </div>

                <div class="col-md-4 col-6">
                    <div class="stat-box daily">
                        <div class="stat-number" id="dailyExpenses">0</div>
                        <div class="stat-label"><i class="bi bi-calendar-day stat-icon"></i>Today</div>
                    </div>
                </div>

                <div class="col-md-4 col-6">
                    <div class="stat-box monthly">
                        <div class="stat-number" id="monthlyExpenses">0</div>
                        <div class="stat-label"><i class="bi bi-calendar-month stat-icon"></i>This Month</div>
                    </div>
                </div>

            </div>


            <!-- FILTER SECTION -->

            <div class="card expense-card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-funnel me-2 text-secondary"></i>Filter Expenses
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-folder me-1"></i>Project
                            </label>
                            <select id="expenseProjectFilter" class="form-select">
                                <option value="">All Projects</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-calendar3 me-1"></i>From Date
                            </label>
                            <input type="date" id="expenseFromDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-calendar3 me-1"></i>To Date
                            </label>
                            <input type="date" id="expenseToDate" class="form-control">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100" id="applyFilterBtn">
                                <i class="bi bi-search me-1"></i> Filter
                            </button>
                        </div>
                    </div>
                </div>
            </div>


            <!-- EXPENSES LIST -->

            <div class="card expense-card">

                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-list-ul me-2"></i>Expense Records</span>
                    <span class="badge bg-primary" id="expenseCount">0</span>
                </div>

                <div class="card-body p-0" id="expenseListContainer">

                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-inbox display-4 d-block mb-3 opacity-50"></i>
                        <h5>No Expenses</h5>
                        <p>Add your first expense record.</p>
                    </div>

                </div>

            </div>


        </main>

    </div>


    <!-- =====================================================
         ADD/EDIT EXPENSE MODAL
    ===================================================== -->

    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle me-2"></i>Add Expense
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-folder me-1"></i>Project
                        </label>
                        <select id="expenseProject" class="form-select">
                            <option value="">-- Select Project --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-currency-rupee me-1"></i>Amount
                        </label>
                        <input type="number" id="expenseAmount" class="form-control" step="0.01" min="0" placeholder="Enter amount">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-calendar3 me-1"></i>Date
                        </label>
                        <input type="date" id="expenseDate" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-card-text me-1"></i>Description
                        </label>
                        <textarea id="expenseDescription" class="form-control" rows="2" placeholder="Enter description (optional)"></textarea>
                    </div>

                    <div id="expenseError" class="text-danger small"></div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveExpenseBtn">
                        <i class="bi bi-save me-1"></i> Save Expense
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>


    <!-- Include -->
    <script src="js/include.js"></script>


    <!-- Central Database -->
    <script src="js/db.js"></script>


    <script>
        // =====================================================
        // EXPENSES MANAGEMENT
        // =====================================================


        // =====================================================
        // STORE
        // =====================================================

        const EXPENSE_STORE = "expenses";
        const PROJECT_STORE = STORES.PROJECTS;

        let currentExpenses = [];
        let editExpenseId = null;


        // =====================================================
        // GET ALL PROJECTS
        // =====================================================

        async function getProjects() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(PROJECT_STORE, "readonly");
                const store = transaction.objectStore(PROJECT_STORE);
                const request = store.getAll();
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // GET ALL EXPENSES
        // =====================================================

        async function getAllExpenses() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                if (!db.objectStoreNames.contains(EXPENSE_STORE)) {
                    db.close();
                    resolve([]);
                    return;
                }
                const transaction = db.transaction(EXPENSE_STORE, "readonly");
                const store = transaction.objectStore(EXPENSE_STORE);
                const request = store.getAll();
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // GET EXPENSES BY PROJECT
        // =====================================================

        async function getExpensesByProject(projectId) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                if (!db.objectStoreNames.contains(EXPENSE_STORE)) {
                    db.close();
                    resolve([]);
                    return;
                }
                const transaction = db.transaction(EXPENSE_STORE, "readonly");
                const store = transaction.objectStore(EXPENSE_STORE);
                const index = store.index('projectId');
                const request = index.getAll(parseInt(projectId));
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // ADD EXPENSE
        // =====================================================

        async function addExpense(expense) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(EXPENSE_STORE, "readwrite");
                const store = transaction.objectStore(EXPENSE_STORE);
                const request = store.add(expense);
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // UPDATE EXPENSE
        // =====================================================

        async function updateExpense(expense) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(EXPENSE_STORE, "readwrite");
                const store = transaction.objectStore(EXPENSE_STORE);
                const request = store.put(expense);
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
                transaction.oncomplete = function() { db.close(); };
            });
        }


        // =====================================================
        // DELETE EXPENSE
        // =====================================================

        async function deleteExpense(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(EXPENSE_STORE, "readwrite");
                const store = transaction.objectStore(EXPENSE_STORE);
                store.delete(id);
                transaction.oncomplete = function() { db.close();
                    resolve(); };
                transaction.onerror = function() { reject(transaction.error); };
            });
        }


        // =====================================================
        // ENSURE EXPENSE STORE EXISTS
        // =====================================================

        async function ensureExpenseStore() {
            try {
                const db = await openDB();
                if (!db.objectStoreNames.contains(EXPENSE_STORE)) {
                    db.close();
                    const APP_NAME = window.APP_NAME || 'tea-estate-management';
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open(APP_NAME, DB_VERSION + 1);
                        request.onupgradeneeded = function(e) {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(EXPENSE_STORE)) {
                                const store = db.createObjectStore(EXPENSE_STORE, { keyPath: "id",
                                    autoIncrement: true });
                                store.createIndex("projectId", "projectId", { unique: false });
                                store.createIndex("date", "date", { unique: false });
                                console.log("✅ Expenses store created");
                            }
                        };
                        request.onsuccess = function(e) {
                            const db = e.target.result;
                            db.close();
                            resolve();
                        };
                        request.onerror = function() {
                            reject(request.error);
                        };
                    });
                } else {
                    db.close();
                    return;
                }
            } catch (error) {
                console.error('Error ensuring expense store:', error);
            }
        }


        // =====================================================
        // LOAD PROJECTS INTO SELECTS
        // =====================================================

        async function loadProjects() {
            try {
                const projects = await getProjects();
                const selects = ['expenseProject', 'expenseProjectFilter'];

                selects.forEach(selectId => {
                    const select = document.getElementById(selectId);
                    if (!select) return;
                    const currentValue = select.value;

                    select.innerHTML = '<option value="">' + (selectId === 'expenseProject' ? '-- Select Project --' :
                        'All Projects') + '</option>';

                    if (projects.length === 0) {
                        select.innerHTML += '<option value="" disabled>No projects available</option>';
                    } else {
                        projects.forEach(project => {
                            const option = document.createElement('option');
                            option.value = project.id;
                            option.textContent = project.name;
                            select.appendChild(option);
                        });
                    }

                    if (currentValue && projects.some(p => p.id == currentValue)) {
                        select.value = currentValue;
                    }
                });
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }


        // =====================================================
        // SET DEFAULT DATE
        // =====================================================

        function setDefaultDate() {
            const dateInput = document.getElementById('expenseDate');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }


        // =====================================================
        // CALCULATE STATISTICS
        // =====================================================

        function calculateStatistics(expenses) {
            const total = expenses.reduce((sum, e) => sum + e.amount, 0);

            const today = new Date().toISOString().split('T')[0];
            const daily = expenses.filter(e => e.date === today).reduce((sum, e) => sum + e.amount, 0);

            const currentMonth = new Date().toISOString().substring(0, 7);
            const monthly = expenses.filter(e => e.date.substring(0, 7) === currentMonth).reduce((sum, e) => sum + e.amount,
            0);

            document.getElementById('totalExpenses').textContent = total.toFixed(2);
            document.getElementById('dailyExpenses').textContent = daily.toFixed(2);
            document.getElementById('monthlyExpenses').textContent = monthly.toFixed(2);
        }


        // =====================================================
        // RENDER EXPENSES
        // =====================================================

        async function renderExpenses() {
            const container = document.getElementById('expenseListContainer');
            const countBadge = document.getElementById('expenseCount');

            const projectFilter = document.getElementById('expenseProjectFilter').value;
            const fromDate = document.getElementById('expenseFromDate').value;
            const toDate = document.getElementById('expenseToDate').value;

            try {
                let expenses = await getAllExpenses();

                if (projectFilter) {
                    expenses = expenses.filter(e => e.projectId == projectFilter);
                }

                if (fromDate) {
                    expenses = expenses.filter(e => e.date >= fromDate);
                }

                if (toDate) {
                    expenses = expenses.filter(e => e.date <= toDate);
                }

                expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

                currentExpenses = expenses;
                countBadge.textContent = expenses.length;

                calculateStatistics(expenses);

                if (expenses.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-4 d-block mb-3 opacity-50"></i>
                            <h5>No Expenses</h5>
                            <p>Add your first expense record.</p>
                        </div>
                    `;
                    return;
                }

                const projects = await getProjects();
                const projectMap = {};
                projects.forEach(p => { projectMap[p.id] = p.name; });

                let html = '<div class="list-group list-group-flush">';

                expenses.forEach((expense) => {
                    html += `
                        <div class="list-group-item expense-item">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <div class="flex-grow-1">
                                    <div class="d-flex align-items-center gap-2 flex-wrap">
                                        <strong>${escapeHTML(projectMap[expense.projectId] || 'Unknown Project')}</strong>
                                    </div>
                                    <div class="text-muted small">
                                        <i class="bi bi-calendar3 me-1"></i>${expense.date}
                                        ${expense.description ? `| ${escapeHTML(expense.description)}` : ''}
                                    </div>
                                </div>
                                <div class="text-end">
                                    <div class="expense-amount">₹${expense.amount.toFixed(2)}</div>
                                    <div class="mt-1">
                                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editExpense(${expense.id})" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="removeExpense(${expense.id})" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                container.innerHTML = html;

            } catch (error) {
                console.error('Error rendering expenses:', error);
                container.innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <i class="bi bi-exclamation-triangle display-4 d-block mb-3"></i>
                        <h5>Error Loading</h5>
                        <p>${escapeHTML(error.message || 'Please try again.')}</p>
                    </div>
                `;
            }
        }


        // =====================================================
        // SAVE EXPENSE
        // =====================================================

        async function saveExpense() {
            const projectSelect = document.getElementById('expenseProject');
            const amountInput = document.getElementById('expenseAmount');
            const dateInput = document.getElementById('expenseDate');
            const descInput = document.getElementById('expenseDescription');
            const errorDiv = document.getElementById('expenseError');

            const projectId = projectSelect.value;
            const amount = parseFloat(amountInput.value);
            const date = dateInput.value;
            const description = descInput.value.trim();

            errorDiv.textContent = '';

            if (!projectId) {
                errorDiv.textContent = 'Please select a project.';
                projectSelect.focus();
                return;
            }

            if (!amount || amount <= 0) {
                errorDiv.textContent = 'Please enter a valid amount.';
                amountInput.focus();
                return;
            }

            if (!date) {
                errorDiv.textContent = 'Please select a date.';
                dateInput.focus();
                return;
            }

            try {
                const expenseData = {
                    projectId: parseInt(projectId),
                    amount: amount,
                    date: date,
                    description: description,
                    updatedAt: new Date().toISOString()
                };

                if (editExpenseId) {
                    expenseData.id = editExpenseId;
                    expenseData.createdAt = currentExpenses.find(e => e.id === editExpenseId)?.createdAt || new Date()
                        .toISOString();
                    await updateExpense(expenseData);
                } else {
                    expenseData.createdAt = new Date().toISOString();
                    await addExpense(expenseData);
                }

                editExpenseId = null;
                document.querySelector('#expenseModal .modal-title').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Add Expense';
                document.getElementById('saveExpenseBtn').innerHTML = '<i class="bi bi-save me-1"></i> Save Expense';
                document.getElementById('expenseProject').value = '';
                document.getElementById('expenseAmount').value = '';
                document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('expenseDescription').value = '';

                const modalElement = document.getElementById('expenseModal');
                const modal = bootstrap.Modal.getInstance(modalElement);
                modal.hide();

                await renderExpenses();

            } catch (error) {
                console.error('Error saving expense:', error);
                errorDiv.textContent = 'Failed to save expense. Please try again.';
            }
        }


        // =====================================================
        // EDIT EXPENSE
        // =====================================================

        async function editExpense(id) {
            try {
                const expenses = await getAllExpenses();
                const expense = expenses.find(e => e.id === id);

                if (!expense) {
                    alert('Expense not found.');
                    return;
                }

                editExpenseId = id;

                document.querySelector('#expenseModal .modal-title').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Edit Expense';
                document.getElementById('saveExpenseBtn').innerHTML = '<i class="bi bi-pencil me-1"></i> Update Expense';

                document.getElementById('expenseProject').value = expense.projectId;
                document.getElementById('expenseAmount').value = expense.amount;
                document.getElementById('expenseDate').value = expense.date;
                document.getElementById('expenseDescription').value = expense.description || '';
                document.getElementById('expenseError').textContent = '';

                const modalElement = document.getElementById('expenseModal');
                const modal = new bootstrap.Modal(modalElement);
                modal.show();

            } catch (error) {
                console.error('Error loading expense for edit:', error);
                alert('Error loading expense data.');
            }
        }


        // =====================================================
        // REMOVE EXPENSE
        // =====================================================

        async function removeExpense(id) {
            if (!confirm('Delete this expense record?')) return;

            try {
                await deleteExpense(id);
                await renderExpenses();
            } catch (error) {
                console.error('Error deleting expense:', error);
                alert('Error deleting expense.');
            }
        }


        // =====================================================
        // HTML ESCAPE
        // =====================================================

        function escapeHTML(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }


        // =====================================================
        // INITIALIZE
        // =====================================================

        document.addEventListener("DOMContentLoaded", async function() {

            try {

                await loadSettings();
                await openDB();
                await ensureExpenseStore();

                await loadProjects();
                setDefaultDate();
                await renderExpenses();

                document.getElementById('saveExpenseBtn').addEventListener('click', saveExpense);
                document.getElementById('applyFilterBtn').addEventListener('click', renderExpenses);
                document.getElementById('expenseProjectFilter').addEventListener('change', renderExpenses);

                document.getElementById('expenseModal').addEventListener('hidden.bs.modal', function() {
                    editExpenseId = null;
                    document.querySelector('#expenseModal .modal-title').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Add Expense';
                    document.getElementById('saveExpenseBtn').innerHTML = '<i class="bi bi-save me-1"></i> Save Expense';
                    document.getElementById('expenseError').textContent = '';
                });

            } catch (error) {
                console.error("Expense initialization error:", error);
            }

        });
    </script>

</body>

</html>
