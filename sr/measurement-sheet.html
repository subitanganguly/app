<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement Sheets - SR Group</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="sidebar/sidebar.css">

    <style>
        .field-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .table th {
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .table td {
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .sheet-link {
            font-weight: 600;
            text-decoration: none;
        }

        .sheet-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div id="sidebar-container"></div>

<main id="main-content">
    <div class="container-fluid p-4">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
            <div>
                <h3 class="mb-1">
                    <i class="bi bi-rulers me-2"></i>
                    Measurement Sheets
                </h3>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <label for="businessSelect" class="text-muted mb-0">Business</label>
                    <select class="form-select form-select-sm" id="businessSelect" style="min-width: 260px;" disabled>
                        <option value="">Loading...</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-primary" id="addSheetBtn" disabled>
                    <i class="bi bi-plus-lg me-1"></i> New Sheet
                </button>
            </div>
        </div>

        <!-- USER -->
        <div class="alert alert-light border mb-4">
            <i class="bi bi-person-circle me-2"></i>
            <strong id="currentUserName">Loading...</strong>
            <span class="badge bg-primary ms-2" id="currentUserRole">Loading...</span>
        </div>

        <!-- SHEETS -->
        <div class="card shadow-sm d-none" id="sheetsCard">
            <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <strong><i class="bi bi-list-ul me-2"></i> Sheets</strong>
                    <div class="small text-muted">
                        <span id="sheetCount">0</span> of
                        <span id="sheetTotal">0</span> sheet(s)
                    </div>
                </div>

                <div class="input-group input-group-sm" style="width: 260px;">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search sheets...">
                    <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn" title="Clear search">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mb-0" id="sheetsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 60px;">#</th>
                            <th>Title</th>
                            <th>Created</th>
                            <th>Created by</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sheetsBody">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- EMPTY -->
        <div id="emptyState" class="text-center text-muted py-5 d-none">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
            <span id="emptyStateText">Select a business to see its measurement sheets.</span>
        </div>

    </div>
</main>

<!-- SHEET MODAL -->
<div class="modal fade" id="sheetModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="sheetForm">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-pencil-square me-2"></i>
                        <span id="sheetModalTitle">New Sheet</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="sheetId">

                    <label class="field-label" for="sheetTitle">Sheet title</label>
                    <input type="text" class="form-control" id="sheetTitle" maxlength="120"
                           placeholder="e.g. Ground floor slab – Block A" required autocomplete="off">
                    <div class="form-text mt-2">
                        Saving to business: <strong id="sheetBusinessNote">-</strong>
                    </div>
                    <div class="text-danger small mt-2 d-none" id="sheetError"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveSheetBtn">
                        <i class="bi bi-check-lg me-1"></i> Save Sheet
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="sidebar/sidebar.js"></script>

<script type="module">

    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { ref, get, set, push, update } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

    // =====================================================
    // CONSTANTS
    // =====================================================

    const GLOBAL_ADMIN_ROLES = ["main-admin", "dev-admin"];

    // =====================================================
    // STATE
    // =====================================================

    let currentUser = null;
    let currentRole = "";
    let currentUserData = null;
    let businessId = "";
    let sheets = {};
    let searchQuery = "";

    const sheetModal = new bootstrap.Modal(document.getElementById("sheetModal"));

    // =====================================================
    // PATHS  (saved under the business, like "records")
    // =====================================================

    function businessPath() {
        return `sr_group/businesses/${businessId}`;
    }

    function sheetsPath() {
        return `${businessPath()}/measurement-sheets`;
    }

    // =====================================================
    // AUTH
    // =====================================================

    onAuthStateChanged(auth, async user => {
        if (!user) {
            location.href = "login.html";
            return;
        }

        currentUser = user;

        let snapshot;
        try {
            snapshot = await get(ref(db, `sr_group/users/${user.uid}`));
        }
        catch (err) {
            console.error("Failed to load user profile:", err);
            location.href = "login.html";
            return;
        }

        if (!snapshot.exists()) {
            location.href = "login.html";
            return;
        }

        currentUserData = snapshot.val();
        currentRole = currentUserData.role || "";

        document.getElementById("currentUserName").textContent =
            currentUserData.name || user.email;
        document.getElementById("currentUserRole").textContent = currentRole;

        if (!hasMeasurementAccess()) {
            document.getElementById("businessSelect").innerHTML = `<option value="">-</option>`;
            showFatal("You do not have access to measurement sheets.");
            return;
        }

        await initBusinessSelect();
    });

    // =====================================================
    // ACCESS HELPERS
    // =====================================================

    function isGlobalAdmin() {
        return GLOBAL_ADMIN_ROLES.includes(currentRole);
    }

    function hasMeasurementAccess() {
        return isGlobalAdmin() || currentUserData?.measurementSheetAccess === true;
    }

    function userHasBusinessAccess(id) {
        if (isGlobalAdmin()) return true;

        const access = currentUserData?.businessAccess;
        if (!access || typeof access !== "object") return false;

        return Object.prototype.hasOwnProperty.call(access, id);
    }

    // =====================================================
    // BUSINESS SELECT
    // =====================================================

    const businessSelect = document.getElementById("businessSelect");

    async function getAccessibleBusinesses() {
        if (isGlobalAdmin()) {
            const snap = await get(ref(db, "sr_group/businesses"));
            const all = snap.exists() ? snap.val() : {};
            return Object.entries(all).map(([id, b]) => ({ id, name: b?.name || id }));
        }

        const access = currentUserData?.businessAccess || {};
        return Object.entries(access).map(([id, b]) => ({ id, name: b?.name || id }));
    }

    async function initBusinessSelect() {
        let list = [];
        try {
            list = await getAccessibleBusinesses();
        }
        catch (err) {
            console.error("Failed to load businesses:", err);
            businessSelect.innerHTML = `<option value="">Unable to load</option>`;
            showFatal("Unable to load businesses.");
            return;
        }

        if (!list.length) {
            businessSelect.innerHTML = `<option value="">No business assigned</option>`;
            showFatal("No business is assigned to your account.");
            return;
        }

        list.sort((a, b) => a.name.localeCompare(b.name));

        businessSelect.innerHTML = `<option value="">-- Select business --</option>`;
        list.forEach(b => {
            const o = document.createElement("option");
            o.value = b.id;
            o.textContent = `${b.name} (${b.id})`;
            businessSelect.appendChild(o);
        });
        businessSelect.disabled = false;

        // Nothing is chosen for the user. A business is only preselected when the
        // URL carries one (e.g. coming back from the data page).
        const fromUrl = new URLSearchParams(location.search).get("business") || "";

        if (fromUrl && list.some(b => b.id === fromUrl)) {
            businessSelect.value = fromUrl;
            await selectBusiness(fromUrl, false);
            return;
        }

        if (fromUrl) {
            showFatal("You do not have access to this business. Select another one.");
            return;
        }

        showPrompt();
    }

    businessSelect.addEventListener("change", () => {
        selectBusiness(businessSelect.value, true);
    });

    async function selectBusiness(id, updateUrl) {
        businessId = id;
        sheets = {};
        searchQuery = "";
        document.getElementById("searchInput").value = "";

        if (updateUrl) {
            history.replaceState(null, "", id ? `?business=${encodeURIComponent(id)}` : location.pathname);
        }

        if (!id) {
            showPrompt();
            return;
        }

        if (!userHasBusinessAccess(id)) {
            showFatal("You do not have access to this business. Select another one.");
            return;
        }

        document.getElementById("addSheetBtn").disabled = false;
        await loadSheets();
    }

    function selectedBusinessLabel() {
        const opt = businessSelect.selectedOptions[0];
        return opt && opt.value ? opt.textContent : businessId;
    }

    function showPrompt() {
        document.getElementById("sheetsCard").classList.add("d-none");
        document.getElementById("addSheetBtn").disabled = true;
        document.getElementById("emptyState").classList.remove("d-none");
        document.getElementById("emptyStateText").textContent =
            "Select a business to see its measurement sheets.";
    }

    // =====================================================
    // LOAD SHEETS
    // =====================================================

    async function loadSheets() {
        const requested = businessId;

        let snapshot;
        try {
            snapshot = await get(ref(db, sheetsPath()));
        }
        catch (err) {
            console.error("Failed to load sheets:", err);
            if (requested === businessId) showFatal("Unable to load measurement sheets.");
            return;
        }

        if (requested !== businessId) return;   // user switched business meanwhile

        sheets = snapshot.exists() ? snapshot.val() : {};
        renderSheets();
    }

    // =====================================================
    // RENDER
    // =====================================================

    function renderSheets() {
        const tbody = document.getElementById("sheetsBody");
        const card = document.getElementById("sheetsCard");
        const empty = document.getElementById("emptyState");

        tbody.innerHTML = "";

        const all = Object.entries(sheets);
        const q = searchQuery.trim().toLowerCase();

        const filtered = all
            .filter(([, s]) => !q || String(s.title || "").toLowerCase().includes(q))
            .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

        document.getElementById("sheetTotal").textContent = all.length;
        document.getElementById("sheetCount").textContent = filtered.length;

        if (!filtered.length) {
            card.classList.toggle("d-none", all.length === 0);
            empty.classList.remove("d-none");
            document.getElementById("emptyStateText").textContent =
                all.length === 0
                    ? "No measurement sheets yet. Click “New Sheet” to create one."
                    : "No sheets match your search.";
            if (all.length > 0) {
                tbody.innerHTML = "";
            }
            return;
        }

        card.classList.remove("d-none");
        empty.classList.add("d-none");

        filtered.forEach(([id, sheet], index) => {
            const tr = document.createElement("tr");

            const dataUrl =
                `measurement-sheet-data.html?business=${encodeURIComponent(businessId)}&sheet=${encodeURIComponent(id)}`;

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><a class="sheet-link" href="${dataUrl}">${escapeHtml(sheet.title || "-")}</a></td>
                <td>${escapeHtml(formatDate(sheet.createdAt))}</td>
                <td>${escapeHtml(sheet.createdByName || "-")}</td>
                <td class="text-end">
                    <div class="btn-group btn-group-sm">
                        <a class="btn btn-outline-success" href="${dataUrl}" title="Open data">
                            <i class="bi bi-box-arrow-up-right"></i> Open
                        </a>
                        <button class="btn btn-outline-primary edit-sheet" title="Rename">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-outline-danger delete-sheet" title="Delete">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            `;

            tr.querySelector(".edit-sheet").addEventListener("click", () => openSheetModal(id, sheet));
            tr.querySelector(".delete-sheet").addEventListener("click", () => deleteSheet(id, sheet));

            tbody.appendChild(tr);
        });
    }

    // =====================================================
    // SEARCH
    // =====================================================

    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("input", () => {
        searchQuery = searchInput.value;
        renderSheets();
    });

    document.getElementById("clearSearchBtn").addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        renderSheets();
    });

    // =====================================================
    // MODAL
    // =====================================================

    document.getElementById("addSheetBtn").addEventListener("click", () => {
        if (!businessId) return;
        openSheetModal(null, null);
    });

    function openSheetModal(id, sheet) {
        const isEdit = !!id;

        document.getElementById("sheetModalTitle").textContent = isEdit ? "Rename Sheet" : "New Sheet";
        document.getElementById("sheetId").value = isEdit ? id : "";
        document.getElementById("sheetTitle").value = isEdit ? (sheet.title || "") : "";
        document.getElementById("sheetBusinessNote").textContent = selectedBusinessLabel();
        hideError();

        sheetModal.show();
    }

    document.getElementById("sheetModal").addEventListener("shown.bs.modal", () => {
        const input = document.getElementById("sheetTitle");
        input.focus();
        input.select();
    });

    function showError(msg) {
        const el = document.getElementById("sheetError");
        el.textContent = msg;
        el.classList.remove("d-none");
    }

    function hideError() {
        document.getElementById("sheetError").classList.add("d-none");
    }

    // =====================================================
    // SAVE
    // =====================================================

    document.getElementById("sheetForm").addEventListener("submit", async event => {
        event.preventDefault();
        hideError();

        const id = document.getElementById("sheetId").value;
        const title = document.getElementById("sheetTitle").value.trim();

        if (!businessId) {
            showError("Select a business first.");
            return;
        }

        if (!title) {
            showError("Enter a title for the sheet.");
            return;
        }

        const duplicate = Object.entries(sheets).some(
            ([otherId, s]) =>
                otherId !== id &&
                String(s.title || "").trim().toLowerCase() === title.toLowerCase()
        );

        if (duplicate) {
            showError("A sheet with this title already exists. Use a different title.");
            return;
        }

        const saveBtn = document.getElementById("saveSheetBtn");
        saveBtn.disabled = true;

        try {
            if (id) {
                const changes = { title, updatedAt: Date.now() };
                await update(ref(db, `${sheetsPath()}/${id}`), changes);
                sheets[id] = { ...sheets[id], ...changes };
            }
            else {
                const payload = {
                    title,
                    createdAt: Date.now(),
                    createdBy: currentUser.uid,
                    createdByName: currentUserData.name || currentUser.email || ""
                };

                const newRef = push(ref(db, sheetsPath()));
                await set(newRef, payload);
                sheets[newRef.key] = payload;
            }

            sheetModal.hide();
            renderSheets();
        }
        catch (err) {
            console.error("Failed to save sheet:", err);
            showError("Failed to save the sheet. Check your connection and try again.");
        }
        finally {
            saveBtn.disabled = false;
        }
    });

    // =====================================================
    // DELETE  (removes the title AND all its data in one write)
    // =====================================================

    async function deleteSheet(id, sheet) {
        const ok = confirm(
            `Delete "${sheet.title}"?\n\n` +
            `All measurement data saved under this sheet will also be deleted. This cannot be undone.`
        );
        if (!ok) return;

        try {
            await update(ref(db, businessPath()), {
                [`measurement-sheets/${id}`]: null,
                [`measurement-sheet-data/${id}`]: null
            });

            delete sheets[id];
            renderSheets();
        }
        catch (err) {
            console.error("Failed to delete sheet:", err);
            alert("Failed to delete the sheet. Please try again.");
        }
    }

    // =====================================================
    // HELPERS
    // =====================================================

    function formatDate(ms) {
        if (!ms) return "-";
        return new Date(ms).toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showFatal(message) {
        document.getElementById("sheetsCard").classList.remove("d-none");
        document.getElementById("sheetsBody").innerHTML = `
            <tr>
                <td colspan="5" class="text-center text-danger py-4">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    ${escapeHtml(message)}
                </td>
            </tr>
        `;
        document.getElementById("emptyState").classList.add("d-none");
        document.getElementById("addSheetBtn").disabled = true;
    }

</script>

</body>
</html>
